function weatherIcon(code){if(code===0)return '☀️';if([1,2].includes(code))return '🌤️';if(code===3)return '☁️';if([45,48].includes(code))return '🌫️';if([51,53,55,61,63,65,80,81,82].includes(code))return '🌧️';if([71,73,75,77,85,86].includes(code))return '❄️';if([95,96,99].includes(code))return '⛈️';return '🌦️'}
function weatherText(code){if(code===0)return 'Clear sky';if([1,2].includes(code))return 'Partly cloudy';if(code===3)return 'Overcast';if([45,48].includes(code))return 'Fog';if([51,53,55,61,63,65,80,81,82].includes(code))return 'Rain';if([71,73,75,77,85,86].includes(code))return 'Snow';if([95,96,99].includes(code))return 'Thunderstorm';return 'Variable conditions'}
async function getWeather(city=state.city){state.city=city;persist();toast('Loading weather…');try{let geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=${state.lang}&format=json`);if(!geo.ok)throw 0;let gd=await geo.json();if(!gd.results?.length)throw 0;let g=gd.results[0];state.city=[g.name,g.admin1,g.country].filter(Boolean).slice(0,2).join(', ');let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,uv_index&hourly=precipitation_probability,temperature_2m,weather_code,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7`);if(!r.ok)throw 0;let d=await r.json();state.weather={...d.current,timezone:d.timezone,location:state.city,lat:g.latitude,lon:g.longitude,updated:new Date().toISOString(),sunrise:d.daily.sunrise?.[0],sunset:d.daily.sunset?.[0],uvmax:d.daily.uv_index_max?.[0]};let nowIdx=(d.hourly.time||[]).findIndex(x=>new Date(x).getTime()>=Date.now()-3600000);state.hourly=(d.hourly.time||[]).slice(Math.max(0,nowIdx),Math.max(0,nowIdx)+6).map((time,j)=>{let i=Math.max(0,nowIdx)+j;return {time,temp:d.hourly.temperature_2m[i],code:d.hourly.weather_code[i],rain:d.hourly.precipitation_probability[i],uv:d.hourly.uv_index[i]}});state.forecast=(d.daily.time||[]).map((day,i)=>({day,code:d.daily.weather_code[i],max:d.daily.temperature_2m_max[i],min:d.daily.temperature_2m_min[i],rain:d.daily.precipitation_probability_max[i],uv:d.daily.uv_index_max?.[i],sunrise:d.daily.sunrise?.[i],sunset:d.daily.sunset?.[i]}));localStorage.cs_weather=JSON.stringify({weather:state.weather,forecast:state.forecast,hourly:state.hourly});toast('Weather updated');render()}catch(e){toast(t('apiError'));if(!state.weather){let old=localStorage.cs_weather;if(old){try{let x=JSON.parse(old);state.weather=x.weather;state.forecast=x.forecast;state.hourly=x.hourly||[]}catch{}}render()}}}
function wxCard(){let w=state.weather;if(!w)return `<div class="card span-8 weather-card"><div class="weather-head"><div><div class="pill" style="background:#ffffff25;color:white">● ${t('weather')}</div><h3 style="margin-top:14px">${esc(state.city||'Choose location')}</h3><p class="muted">${t('noWeather')}</p><div class="row" style="margin-top:12px"><input id="cityInput" placeholder="${t('search')}" value="${esc(state.city)}" style="border:1px solid #ffffff55;background:#ffffff18;color:white;padding:10px;border-radius:9px;max-width:210px"><button class="btn" id="citySearch" style="background:white;color:var(--green)">${t('apply')}</button><button class="btn" id="geoBtn" style="background:#ffffff22;border:1px solid #ffffff55">${t('useLoc')}</button></div></div><div class="weather-icon">🌦️</div></div></div>`;let temp=Math.round(w.temperature_2m),code=w.weather_code;return `<div class="card span-8 weather-card"><div class="weather-head"><div><div class="pill" style="background:#ffffff25;color:white">● ${t('weather')}</div><h3 style="margin-top:12px">${esc(w.location||state.city)}</h3><div class="temp">${temp}°C</div><div>${weatherText(code)} · ${t('feels')} ${Math.round(w.apparent_temperature)}°C</div></div><div class="weather-icon">${weatherIcon(code)}</div></div><div class="weather-meta"><div><b>${w.relative_humidity_2m}%</b><small>${t('humidity')}</small></div><div><b>${Math.round(w.wind_speed_10m)} km/h</b><small>${t('wind')}</small></div><div><b>${Number(w.uv_index??0).toFixed(0)} / 11+</b><small>UV index</small></div><div><b>${state.forecast[0]?.rain??0}%</b><small>Rain chance</small></div></div><div class="weather-meta" style="margin-top:10px"><div><b>🌅 ${w.sunrise?new Date(w.sunrise).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—'}</b><small>Sunrise</small></div><div><b>🌇 ${w.sunset?new Date(w.sunset).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—'}</b><small>Sunset</small></div><div><b>${Number(w.uvmax??0).toFixed(0)}</b><small>Daily max UV</small></div></div><div class="between" style="margin-top:16px"><small class="muted">${t('updated')} ${new Date(w.updated).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · Open-Meteo</small><button class="btn small" id="refreshWx">${t('refresh')}</button></div></div>`}
function forecastCard(){let hourly=state.hourly||[];let hours=hourly.length?`<div class="card span-12"><h3>🕒 Next hours weather</h3><div class="forecast">${hourly.map(f=>`<div class="forecast-item"><strong>${new Date(f.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</strong><div class="ficon">${weatherIcon(f.code)}</div><b>${Math.round(f.temp)}°C</b><small>🌧️ ${f.rain??0}%</small><div class="metric-label">UV ${Number(f.uv??0).toFixed(0)}</div></div>`).join('')}</div></div>`:`<div class="card span-12"><h3>🕒 Next hours weather</h3><p class="muted">${t('weatherHint')}</p></div>`;let days=state.forecast.length?`<div class="card span-12"><h3>${t('forecast')} · 7 days</h3><div class="forecast">${state.forecast.map((f,i)=>`<div class="forecast-item"><strong>${i===0?'Today':new Date(f.day+'T12:00:00').toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',{weekday:'short'})}</strong><div class="ficon">${weatherIcon(f.code)}</div><b>${Math.round(f.max)}°</b><small> / ${Math.round(f.min)}°C</small><div style="font-size:11px;margin-top:6px">💧 ${f.rain??0}%</div><div style="font-size:11px">UV ${Number(f.uv??0).toFixed(0)}</div></div>`).join('')}</div></div>`:`<div class="card span-12"><h3>${t('forecast')}</h3><p class="muted">${t('weatherHint')}</p></div>`;return hours+days}function profileAdvice(){let key=({farmer:'farmerTips',shopkeeper:'shopTips',dairy:'dairyTips',worker:'workerTips',household:'homeTips',business:'businessTips'})[state.profile]||'homeTips';return `<div class="alert green"><span>🌱</span><div><strong>${t('tips')}</strong><p>${t(key)}</p></div></div>`}
function alertsContent(){let w=state.weather;let alerts=[];if(w&&Number(w.uv_index)>=8)alerts.push(['red','☀️','High UV index',`UV index is ${Number(w.uv_index).toFixed(0)}. Seek shade, wear protective clothing and sunscreen, especially around midday.`]);if(w&&w.temperature_2m>=40)alerts.push(['red','🔥','High temperature',`Current temperature is ${Math.round(w.temperature_2m)}°C. Reduce strenuous outdoor activity, seek shade/cooling, and follow official heat alerts.`]);if(w&&[95,96,99].includes(w.weather_code))alerts.push(['red','⛈️','Thunderstorm conditions','Move indoors; avoid open fields, isolated trees, and exposed metal structures.']);if(w&&state.forecast.some(f=>f.rain>=70))alerts.push(['','🌧️','Rain likely in forecast','Check local forecasts and protect equipment, crops, and drainage.']);if(!alerts.length)alerts.push(['green','✓',t('noAlert'),t('disclaimer')]);return alerts.map(a=>`<div class="alert ${a[0]}"><span>${a[1]}</span><div><strong>${a[2]}</strong><p>${a[3]}</p></div></div>`).join('')}
function home(){let monthly=state.kwh*state.tariff*30;let carbon=state.kwh*30*.7;return `<div class="welcome"><div><h2>${t('welcome')} 👋</h2><p>${t('subtitle')}</p></div><span class="pill">🌿 ${categories.find(c=>c[0]===state.profile)?.[state.lang==='hi'?3:2]}</span></div><div class="grid">${wxCard()}${forecastCard()}${cardMetric('⚡',t('electricity'),`₹${Math.round(monthly).toLocaleString('en-IN')}`,`${t('monthly')} · ${state.kwh} kWh/day`)}${cardMetric('💧',t('water'),`${Math.round(state.water*30).toLocaleString('en-IN')} L`,`${t('monthly')} · ${state.water} L/day`)}${cardMetric('☀️',t('solar'),`${(state.kwh*30*.25).toFixed(0)} kWh`,`Illustrative solar offset`)}${cardMetric('🌍',t('carbon'),`${carbon.toFixed(1)} kg CO₂`,`${t('monthly')} · assumed 0.7 kg/kWh`)}<div class="card span-7"><div class="between"><h3>${t('alerts')}</h3><button class="btn secondary small" data-page="alerts">View all →</button></div>${alertsContent()}</div><div class="card span-5"><h3>${t('quick')}</h3><div class="row"><button class="btn secondary" data-page="resources">⚡ ${t('resources')}</button><button class="btn secondary" data-page="calculators">▦ ${t('calculators')}</button><button class="btn secondary" data-page="emergency">＋ ${t('emergency')}</button></div><div style="margin-top:14px">${profileAdvice()}</div></div><div class="card span-12"><h3>📍 ${t('loc')}</h3><div class="row"><div class="field" style="max-width:320px;margin:0"><input id="cityInput" placeholder="${t('search')}" value="${esc(state.city)}"></div><button class="btn" id="citySearch">${t('apply')}</button><button class="btn secondary" id="geoBtn">${t('useLoc')}</button><button class="btn ghost" id="refreshWx">${t('refresh')}</button></div><p class="footer-note">${t('weatherHint')}</p></div></div>`}
function weatherPage(){return `${pageTitle(t('weather'),'Live forecast from Open-Meteo; severe official warnings may require separate regional services.')}<div class="grid">${wxCard()}${forecastCard()}<div class="card span-12"><h3>Weather guidance</h3>${alertsContent()}${profileAdvice()}</div></div>`}
function resources(){return `${pageTitle(t('resources'),'Track electricity and water use. Records are saved on this device.')}<div class="grid"><div class="card span-6"><h3>⚡ Electricity planner</h3><div class="formgrid"><div class="field"><label>${t('kwh')}</label><input type="number" min="0" step=".1" id="kwh" value="${state.kwh}"></div><div class="field"><label>${t('tariff')}</label><input type="number" min="0" step=".1" id="tariff" value="${state.tariff}"></div></div><div class="row"><button class="btn" id="saveEnergy">${t('save')}</button><span class="pill">Monthly: ₹${Math.round(state.kwh*state.tariff*30).toLocaleString('en-IN')}</span></div><p class="footer-note">Estimate = daily kWh × tariff × 30 days. Check your electricity bill for actual charges.</p></div><div class="card span-6"><h3>💧 Water planner</h3><div class="field"><label>${t('waterL')}</label><input type="number" min="0" id="water" value="${state.water}"></div><div class="row"><button class="btn" id="saveWater">${t('save')}</button><span class="pill">Monthly: ${Math.round(state.water*30).toLocaleString('en-IN')} L</span></div><p class="footer-note">Track estimated usage; this is not a meter reading.</p></div><div class="card span-12"><h3>${t('add')}</h3><form id="recordForm"><div class="formgrid"><div class="field"><label>${t('type')}</label><select id="recordType"><option value="Electricity">Electricity (kWh)</option><option value="Water">Water (litres)</option><option value="Fuel">Fuel (litres)</option><option value="Power cut">Power cut (hours)</option><option value="Business loss">Business loss (₹)</option></select></div><div class="field"><label>${t('amount')}</label><input id="recordAmount" type="number" min="0" step=".1" required></div><div class="field"><label>${t('date')}</label><input id="recordDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>${t('note')}</label><input id="recordNote" maxlength="120" placeholder="Optional note"></div></div><button class="btn">${t('add')}</button></form></div><div class="card span-12"><div class="between"><h3>${t('records')}</h3><div class="row"><button class="btn secondary small" id="exportRecords">${t('export')}</button><button class="btn ghost small" id="clearRecords">${t('clear')}</button></div></div>${recordsTable()}</div></div>`}
function recordsTable(){if(!state.records.length)return `<div class="empty">${t('noRecords')}</div>`;return `<div style="overflow:auto"><table class="table"><thead><tr><th>${t('date')}</th><th>${t('type')}</th><th>${t('amount')}</th><th>${t('note')}</th><th></th></tr></thead><tbody>${state.records.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.type)}</td><td>${Number(r.amount).toLocaleString()}</td><td>${esc(r.note||'—')}</td><td><button class="btn ghost small" data-delete="${r.id}">×</button></td></tr>`).join('')}</tbody></table></div>`}
function calculators(){return `${pageTitle(t('calculators'),'Transparent estimates based on the values you enter.')}<div class="grid"><div class="card span-6"><h3>☀️ ${t('solarTitle')}</h3><div class="formgrid"><div class="field"><label>${t('dailyUse')}</label><input id="sUse" type="number" min="0" value="${state.kwh}"></div><div class="field"><label>${t('sun')}</label><input id="sSun" type="number" min="0" max="12" step=".1" value="5.5"></div><div class="field"><label>${t('capacity')}</label><input id="sCap" type="number" min="0" step=".1" value="3"></div><div class="field"><label>${t('eff')}</label><input id="sEff" type="number" min="1" max="100" value="80"></div><div class="field"><label>${t('cost')}</label><input id="sCost" type="number" min="0" value="180000"></div><div class="field"><label>${t('rate')}</label><input id="sRate" type="number" min="0" step=".1" value="${state.tariff}"></div></div><button class="btn" id="solarCalc">${t('calc')}</button><div id="solarResult" style="margin-top:15px"></div><p class="footer-note">Generation = capacity × peak sun hours × efficiency. Savings are capped at your entered daily use. Excludes export credits, seasonal variation, degradation and maintenance.</p></div><div class="card span-6"><h3>🌍 ${t('carbonTitle')}</h3><div class="field"><label>${t('dailyUse')}</label><input id="cUse" type="number" min="0" value="${state.kwh}"></div><div class="field"><label>${t('factor')}</label><input id="cFactor" type="number" min="0" step=".01" value=".7"></div><button class="btn" id="carbonCalc">${t('calc')}</button><div id="carbonResult" style="margin-top:15px"></div><p class="footer-note">Only electricity-related emissions are included. The 0.7 factor is an editable illustrative assumption, not an official current grid factor.</p></div><div class="card span-6"><h3>🔌 ${t('battery')}</h3><div class="formgrid"><div class="field"><label>${t('load')}</label><input id="bLoad" type="number" min="1" value="500"></div><div class="field"><label>${t('batteryWh')}</label><input id="bWh" type="number" min="0" value="1000"></div><div class="field"><label>Usable efficiency (%)</label><input id="bEff" type="number" min="1" max="100" value="85"></div></div><button class="btn" id="batteryCalc">${t('calc')}</button><div id="batteryResult" style="margin-top:15px"></div><p class="footer-note">Estimate assumes constant load; actual backup depends on inverter losses, battery age and starting surges.</p></div><div class="card span-6"><h3>🏪 ${t('lossTitle')}</h3><div class="formgrid"><div class="field"><label>${t('hours')}</label><input id="lHours" type="number" min="0" step=".5" value="2"></div><div class="field"><label>${t('hourly')}</label><input id="lRate" type="number" min="0" value="1500"></div></div><button class="btn" id="lossCalc">${t('calc')}</button><div id="lossResult" style="margin-top:15px"></div><p class="footer-note">Simple estimate = outage hours × loss per hour; indirect losses are not included.</p></div></div>`}
const emergencyGroups=[['heat','Heatwave / extreme heat',['Move to a cooler place and avoid strenuous activity during the hottest hours.','Drink water regularly unless a clinician has restricted your fluids.','Check on children, older adults, and vulnerable neighbours.','Seek urgent medical help for confusion, fainting, or suspected heatstroke.']],['storm','Lightning / thunderstorm',['Go inside a substantial building or hard-topped vehicle.','Avoid open fields, rooftops, isolated trees, and water.','Wait at least 30 minutes after the last thunder before resuming outdoor activity.']],['flood','Heavy rain / flooding',['Never walk or drive through floodwater.','Move to higher ground if flooding threatens.','Keep away from fallen power lines and report them to the utility.']],['power','Power outage',['Keep refrigerator/freezer doors closed. Use torches rather than candles where possible.','Unplug sensitive electronics and use generators outdoors, away from doors and windows.','Prioritize critical loads and follow equipment safety instructions.']],['food','Food and milk safety',['Use a thermometer to check food and milk storage temperatures.','Do not judge food safety by smell or appearance alone.','Follow local food-safety guidance; discard items when safe storage cannot be confirmed.']]];
function emergency(){return `${pageTitle(t('emergency'),'Safety guidance for preparation. In immediate danger, contact local emergency services.')}<div class="grid"><div class="card span-7"><h3>${t('checklist')}</h3><p class="muted">Tick items as you complete them. Checklist saves on this device.</p>${emergencyGroups.map((g,gi)=>`<h4>${t(g[0])}</h4>${g[2].map((item,i)=>{let id=`${gi}-${i}`;return `<label class="checkrow"><input type="checkbox" data-check="${id}" ${state.checklist[id]?'checked':''}><span>${item}</span></label>`}).join('')}`).join('')}</div><div class="card span-5"><h3>Emergency readiness</h3><div class="alert red"><span>⚠️</span><div><strong>Official alerts come first</strong><p>Check local authorities and the India Meteorological Department for warnings. This app does not currently receive official district warning feeds.</p></div></div><h3>Keep ready</h3><div class="checkrow">💧 Drinking water and essential medicines</div><div class="checkrow">🔦 Torch, charged phone and power bank</div><div class="checkrow">📄 Important documents in a waterproof pouch</div><div class="checkrow">🔌 Safe backup power and appliance shutdown plan</div><p class="footer-note">${t('disclaimer')}</p></div></div>`}
function alertsPage(){return `${pageTitle(t('alerts'),'Weather-derived reminders plus your local reminder preferences.')}<div class="grid"><div class="card span-7"><h3>Weather alerts</h3>${alertsContent()}<p class="footer-note">These are simple forecast-based indicators, not an official warning feed. No alert does not mean no risk.</p></div><div class="card span-5"><h3>${t('notifications')}</h3><p class="muted">Choose the reminder topics you want this app to display. Browser push notifications may require the app to remain open unless a push backend is configured.</p>${[['weather','Weather and extreme conditions'],['water','Water conservation'],['energy','Electricity savings'],['farm','Irrigation and crop reminders'],['heat','Hydration and heat safety']].map(([id,label])=>`<label class="checkrow"><input type="checkbox" data-notif="${id}" ${state.notifications[id]!==false?'checked':''}><span>${label}</span></label>`).join('')}<button class="btn" id="saveNotifs" style="margin-top:12px">${t('save')}</button><button class="btn secondary" id="enableNotify" style="margin:12px 0 0 6px">${t('enableNotify')}</button></div></div>`}
function settings(){return `${pageTitle(t('profile'),'Preferences are stored locally in this browser on this device.')}<div class="grid"><div class="card span-6"><h3>${t('category')}</h3><div class="field"><label>${t('category')}</label><select id="profile">${categories.map(c=>`<option value="${c[0]}" ${state.profile===c[0]?'selected':''}>${c[1]} ${c[state.lang==='hi'?3:2]}</option>`).join('')}</select></div><div class="field"><label>${t('city')}</label><input id="settingsCity" value="${esc(state.city)}"></div><div class="field"><label>${t('tariff')}</label><input id="settingsTariff" type="number" min="0" step=".1" value="${state.tariff}"></div><button class="btn" id="saveSettings">${t('save')}</button></div><div class="card span-6"><h3>🎙️ Voice assistant</h3><p>${t('askVoice')}</p><div class="field"><label>Ask a question</label><input id="voiceQuestion" placeholder="How can I save electricity?"></div><div class="row"><button class="btn" id="askText">Get advice</button><button class="btn secondary" id="voiceStart">🎙️ Start speaking</button></div><div id="voiceAnswer" style="margin-top:12px"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>${t('offline')}</h3><p class="muted">The app interface and saved records work locally. Live weather and fresh alerts need internet. Installable offline caching is available when served over HTTPS or localhost.</p><button class="btn secondary" id="installBtn">${t('install')}</button><p class="footer-note">No account/backend is configured. Data stays in this browser's local storage and may be lost if browser data is cleared.</p></div></div>`}
function render(){nav();let main=$('#main');main.innerHTML=({home,weather:weatherPage,resources,calculators,alerts:alertsPage,emergency,settings})[state.page]();bind();if(state.page==='calculators'){calcSolar();calcCarbon();calcBattery();calcLoss()}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});$('#language').onchange=e=>{state.lang=e.target.value;persist();render()};let search=$('#citySearch');if(search)search.onclick=()=>{let v=$('#cityInput')?.value.trim();if(v)getWeather(v)};let geo=$('#geoBtn');if(geo)geo.onclick=()=>{if(!navigator.geolocation){toast('Location is not supported. Enter a town instead.');return}geo.disabled=true;navigator.geolocation.getCurrentPosition(async p=>{try{let r=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&language=${state.lang}&format=json`);let d=await r.json();let g=d.results?.[0];if(g)await getWeather(g.name);else toast('Could not identify your location.')}catch{toast(t('apiError'))}finally{geo.disabled=false}},()=>{toast('Location permission denied. Enter a town instead.');geo.disabled=false})};let refresh=$('#refreshWx');if(refresh)refresh.onclick=()=>getWeather(state.city);
if($('#saveEnergy'))$('#saveEnergy').onclick=()=>{state.kwh=Math.max(0,Number($('#kwh').value)||0);state.tariff=Math.max(0,Number($('#tariff').value)||0);persist();render();toast(t('saved'))};

if($('#clearRecords'))$('#clearRecords').onclick=()=>{if(confirm(t('confirmClear'))){state.records=[];persist();render()}};
if($('#exportRecords'))$('#exportRecords').onclick=()=>{let blob=new Blob([JSON.stringify(state.records,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='climate-smart-records.json';a.click();URL.revokeObjectURL(a.href)};
if($('#solarCalc'))$('#solarCalc').onclick=calcSolar;if($('#carbonCalc'))$('#carbonCalc').onclick=calcCarbon;if($('#batteryCalc'))$('#batteryCalc').onclick=calcBattery;if($('#lossCalc'))$('#lossCalc').onclick=calcLoss;
document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{state.checklist[c.dataset.check]=c.checked;persist()});
document.querySelectorAll('[data-notif]').forEach(c=>c.onchange=()=>{state.notifications[c.dataset.notif]=c.checked;persist()});
if($('#saveNotifs'))$('#saveNotifs').onclick=()=>{persist();toast(t('saved'))};
if($('#enableNotify'))$('#enableNotify').onclick=async()=>{if(!('Notification'in window)){toast(t('notSupported'));return}let p=await Notification.requestPermission();if(p==='granted'){new Notification('Climate Smart',{body:'Browser notifications are enabled while supported by this app.'});toast('Permission granted')}else toast(t('notifyDenied'))};
if($('#saveSettings'))$('#saveSettings').onclick=()=>{state.profile=$('#profile').value;state.city=$('#settingsCity').value.trim()||state.city;state.tariff=Math.max(0,Number($('#settingsTariff').value)||0);persist();render();getWeather(state.city);toast(t('saved'))};
if($('#askText'))$('#askText').onclick=answerQuestion;if($('#voiceStart'))$('#voiceStart').onclick=startVoice;
if($('#installBtn'))$('#installBtn').onclick=()=>{if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt=null}else toast('For installation, open the deployed HTTPS app menu and choose “Install app” or “Add to Home Screen”.')};
}
function calcSolar(){if(!$('#solarResult'))return;let use=Math.max(0,Number($('#sUse').value)||0),sun=Math.max(0,Number($('#sSun').value)||0),cap=Math.max(0,Number($('#sCap').value)||0),eff=Math.min(100,Math.max(0,Number($('#sEff').value)||0))/100,cost=Math.max(0,Number($('#sCost').value)||0),rate=Math.max(0,Number($('#sRate').value)||0);let gen=cap*sun*eff,saved=Math.min(use,gen)*rate*30,pay=saved>0?cost/saved:Infinity;$('#solarResult').innerHTML=`<div class="grid"><div class="card span-6" style="background:#f5faf6;box-shadow:none"><div class="metric">${gen.toFixed(1)} kWh</div><div class="metric-label">${t('solarGen')}</div></div><div class="card span-6" style="background:#f5faf6;box-shadow:none"><div class="metric">₹${Math.round(saved).toLocaleString('en-IN')}</div><div class="metric-label">${t('billSave')}</div></div><div class="card span-12" style="background:#f5faf6;box-shadow:none"><b>${t('payback')}:</b> ${Number.isFinite(pay)?(pay/12).toFixed(1)+' years':'Cannot estimate with current inputs'}<div class="bar"><i style="width:${Math.min(100,gen/Math.max(use,1)*100)}%"></i></div><small class="muted">Estimated solar covers ${use?Math.min(100,gen/use*100).toFixed(0):0}% of daily usage before seasonal variation.</small></div></div>`}
function calcCarbon(){if(!$('#carbonResult'))return;let use=Math.max(0,Number($('#cUse').value)||0),factor=Math.max(0,Number($('#cFactor').value)||0);$('#carbonResult').innerHTML=`<div class="alert green"><span>🌍</span><div><strong>${(use*factor*30).toFixed(1)} kg CO₂ / month</strong><p>${(use*factor).toFixed(2)} kg CO₂ per day based on electricity only.</p></div></div>`}
function calcBattery(){if(!$('#batteryResult'))return;let load=Math.max(0,Number($('#bLoad').value)||0),wh=Math.max(0,Number($('#bWh').value)||0),eff=Math.min(100,Math.max(0,Number($('#bEff').value)||0))/100;let hrs=load?wh*eff/load:Infinity;$('#batteryResult').innerHTML=`<div class="alert green"><span>🔋</span><div><strong>${Number.isFinite(hrs)?hrs.toFixed(2)+' hours':'Enter a load above 0 W'}</strong><p>Estimated backup time at a constant ${load} W load.</p></div></div>`}
function calcLoss(){if(!$('#lossResult'))return;let h=Math.max(0,Number($('#lHours').value)||0),r=Math.max(0,Number($('#lRate').value)||0);$('#lossResult').innerHTML=`<div class="alert"><span>₹</span><div><strong>₹${Math.round(h*r).toLocaleString('en-IN')}</strong><p>${h} outage hours × ₹${r.toLocaleString('en-IN')} estimated loss/hour.</p></div></div>`}
function answerQuestion(){let q=($('#voiceQuestion')?.value||'').toLowerCase(),ans='';if(/water|पानी/.test(q))ans='Save water by fixing leaks, using a bucket where practical, watering plants early/late, and tracking daily use.';else if(/solar|सौर/.test(q))ans='Enter your daily kWh, sunlight hours, system capacity, and tariff in Calculators to estimate solar generation and savings.';else if(/weather|मौसम|rain|बारिश/.test(q))ans=`${state.weather?`Latest fetched weather for ${state.city}: ${Math.round(state.weather.temperature_2m)}°C, ${weatherText(state.weather.weather_code)}.`:'Fetch live weather on the Weather tab.'} Follow official local alerts for emergencies.`;else if(/heat|गर्मी|hydration|पानी/.test(q))ans='During extreme heat, reduce strenuous activity, move to a cooler place, drink water regularly unless medically restricted, and seek urgent help for confusion or fainting.';else if(/electric|बिजली|energy|ऊर्जा|save/.test(q))ans='Track appliance wattage and daily hours, switch off unused equipment, maintain AC filters, and compare monthly kWh. Use the Resources and Calculators tabs.';else ans='Choose Weather for local conditions, Resources to track usage, Calculators for solar/carbon/battery estimates, or Emergency for safety checklists.';$('#voiceAnswer').innerHTML=`<div class="alert green"><span>💡</span><div>${esc(ans)}<div style="margin-top:8px"><button class="btn small" id="speakAnswer">🔊 Read aloud</button></div></div></div>`;$('#speakAnswer').onclick=()=>{if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(ans);u.lang=state.lang==='hi'?'hi-IN':'en-IN';speechSynthesis.speak(u)}else toast('Text-to-speech is not supported here.')}} 
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t('voiceUnsupported'));return}let r=new SR();r.lang=state.lang==='hi'?'hi-IN':'en-IN';r.onresult=e=>{$('#voiceQuestion').value=e.results[0][0].transcript;answerQuestion()};r.onerror=()=>toast('Voice input could not start. Check microphone permission.');r.start()}
window.deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredPrompt=e});
$('#voiceBtn').onclick=()=>{state.page='settings';render();setTimeout(()=>$('#voiceStart')?.click(),50)};
window.addEventListener('online',()=>toast('Internet connection restored'));window.addEventListener('offline',()=>toast('Offline: showing saved records and cached weather only'));
let cached=localStorage.cs_weather;if(cached){try{let x=JSON.parse(cached);state.weather=x.weather;state.forecast=x.forecast;state.hourly=x.hourly||[]}catch{}}
render();getWeather(state.city);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body></html>
